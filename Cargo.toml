[package]
name = "lyra-meta"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lyra-io/lyra-meta"
description = "Shared Lyra contracts: catalog types, authentication, metadata and common utilities."

[features]
default = []
observability = ["dep:opentelemetry_sdk", "dep:opentelemetry-prometheus", "dep:prometheus", "dep:tracing-subscriber", "dep:tracing-appender", "dep:axum", "dep:serde_json"]
pprof = ["observability", "dep:pprof-rs", "dep:flate2"]
tokio-console = ["observability", "dep:console-subscriber", "dep:tonic-console", "dep:tokio-stream", "tokio/tracing"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
libc = "0.2"
oxia-client = "0.1.0"
prost = "0.13"
rand = "0.9"
ring = "0.17.14"
stringprep = "0.1.5"
subtle = "2.6"
zeroize = "1.8"
thiserror = "2.0.12"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = "0.9"
notify = "8.2"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"], optional = true }
opentelemetry-prometheus = { version = "0.32", optional = true }
prometheus = { version = "0.14", optional = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }
tracing-appender = { version = "0.2", optional = true }
axum = { version = "0.8", optional = true }
pprof-rs = { package = "pprof", version = "0.15", path = "vendor/pprof", features = ["prost-codec"], optional = true }
flate2 = { version = "1", optional = true }
console-subscriber = { version = "0.5", optional = true }
tonic-console = { package = "tonic", version = "0.14", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }

[build-dependencies]
prost-build = "0.13.5"

[dev-dependencies]
tempfile = "3"
console-api = "0.9"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "testing"] }
tracing-subscriber = { version = "0.3", features = ["json"] }
