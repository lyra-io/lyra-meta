[package]
name = "lyra-meta"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lyra-io/lyra-meta"
description = "Shared Lyra contracts: catalog types, authentication, metadata and common utilities."

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
libc = "0.2"
oxia-client = "0.1.0"
prost = "0.13"
rand = "0.9"
ring = "0.17.14"
stringprep = "0.1.5"
subtle = "2.6"
zeroize = "1.8"
thiserror = "2.0.12"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }

[build-dependencies]
prost-build = "0.13.5"

[dev-dependencies]
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "testing"] }
tracing-subscriber = { version = "0.3", features = ["json"] }
