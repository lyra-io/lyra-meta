name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "observability", "pprof", "tokio-console", "pprof,tokio-console"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package lyra-meta --check
      - run: cargo test --locked --features '${{ matrix.features }}'
      - run: cargo clippy --locked --all-targets --no-deps --features '${{ matrix.features }}' -- -D warnings
  linux-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.validation -t lyra-meta-validation .
