name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check agent instructions
        run: |
          test -L AGENTS.md
          test "$(readlink AGENTS.md)" = CLAUDE.md
          test -f CLAUDE.md
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Coverage (fail below 100% lines)
        run: cargo llvm-cov --locked --all-features --fail-under-lines 100 --lcov --output-path target/lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/lcov.info
          fail_ci_if_error: true
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - run: cargo package --locked
      - run: git diff --exit-code
