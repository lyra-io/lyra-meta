syntax = "proto3";

package io.lyra.proto.catalog.v1;

message User {
  string name = 1;
  bool is_superuser = 2;
  bool can_create_database = 3;
  bool can_create_user = 4;
  bool can_login = 5;
  PasswordCredential password = 6;
}

message PasswordCredential {
  bytes salt = 1;
  bytes salted_password = 2;
  uint32 iterations = 3;
}

message Database {
  string name = 1;
}

message Schema {
  string name = 1;
}

message Connection {
  string name = 1;
  map<string, string> options = 2;
  repeated SecretRef secret_refs = 3;
}

message Secret {
  string name = 1;
  bytes value = 2;
}

message SecretRef {
  string name = 1;
  string data = 2;
}

message Source {
  string name = 1;
  map<string, string> options = 2;
}

message Sink {
  string name = 1;
  map<string, string> options = 2;
}

message Column {
  string name = 1;
  string data_type = 2;
  bool nullable = 3;
}

message Table {
  string name = 1;
  string source = 2;
  string sink = 3;
  repeated Column columns = 4;
  repeated string primary_key = 5;
  map<string, string> options = 6;
}

message StreamMeta {
  string name = 1;
  int64 stream_id = 2;
  StreamStatus status = 3;
  int64 term = 4;
  int64 version = 5;
  int64 lra = 6;
}

message Segment {
  repeated UnitInfo ensemble = 1;
  int64 start_offset = 2;
}

enum StreamStatus {
  ACTIVE = 0;
  SEALED = 1;
}

enum UnitStatus {
  WRITABLE = 0;
  READONLY = 1;
}

message UnitInfo {
  string id = 1;
  string address = 2;
}

message UnitRegistration {
  UnitInfo unit = 1;
  UnitStatus status = 2;
  string zone = 3;
  double cpu_usage = 4;
  double memory_usage = 5;
  double disk_usage = 6;
}
