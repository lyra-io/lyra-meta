syntax = "proto3";

package io.lyra.proto.catalog.v1;

message Column {
  string name = 1;
  string data_type = 2;
  bool nullable = 3;
}

message Table {
  string name = 1;
  string source = 2;
  string sink = 3;
  repeated Column columns = 4;
  repeated string primary_key = 5;
  map<string, string> options = 6;
}
